# Self-hosted ID/rendezvous (hbbs) + relay (hbbr) server for your RustDesk fork.
# Usage: set RELAY_HOST to your VPS domain or IP, then `docker compose up -d`.
# The public key to embed in clients is in ./data/id_ed25519.pub after first start.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${RELAY_HOST}:21117 -k _
    volumes:
      - ./data:/root
    network_mode: host
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
